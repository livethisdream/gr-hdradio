id: hdradio_hd_receiver
label: HD Radio Receiver
category: '[HD Radio]'
flags: [ python ]

parameters:
-   id: samp_rate
    label: Sample Rate
    dtype: real
    default: samp_rate
-   id: offset
    label: Station Offset (Hz)
    dtype: real
    default: '0'
-   id: mode
    label: Mode
    dtype: enum
    default: "'fm'"
    options: ["'fm'", "'am'"]
    option_labels: [FM, AM]
-   id: programs
    label: Programs
    dtype: raw
    default: '[0]'
-   id: stereo
    label: Channels
    dtype: bool
    default: 'True'
    options: ['True', 'False']
    option_labels: [Stereo, Mono]
-   id: paced
    label: Audio Timing
    dtype: bool
    default: 'True'
    options: ['True', 'False']
    option_labels: [Paced (live), Burst (as decoded)]
-   id: preroll
    label: Preroll (s)
    dtype: real
    default: '0.5'
    hide: ${ 'none' if str(paced) == 'True' else 'all' }

inputs:
-   domain: stream
    dtype: complex

outputs:
-   label: audio
    domain: stream
    dtype: float
    multiplicity: ${ len(programs) * (2 if str(stereo) == 'True' else 1) }
    optional: true
-   domain: message
    id: status
    optional: true
-   domain: message
    id: station
    optional: true
-   domain: message
    id: services
    optional: true
-   domain: message
    id: id3
    optional: true
-   domain: message
    id: files
    optional: true
-   domain: message
    id: data
    optional: true
-   domain: message
    id: hdc
    optional: true

asserts:
- ${ len(set(programs)) == len(programs) }
- ${ all(0 <= p <= 7 for p in programs) }
- ${ str(paced) != 'True' or preroll >= 0 }
- ${ samp_rate > 0 }

templates:
    imports: from gnuradio import hdradio
    make: hdradio.hd_receiver(${samp_rate}, ${mode}, ${offset}, ${programs}, ${stereo}, ${paced}, ${preroll})
    callbacks:
    - set_offset(${offset})

documentation: |-
    HD Radio (NRSC-5) receiver for complex samples at any rate.

    Sample Rate: the input rate. 1,488,375 S/s (a PlutoSDR set to that
    rate) decimates by exactly 2; other rates go through a polyphase
    arbitrary resampler. The rate must cover the HD sidebands: at least
    744,187.5 S/s for FM.

    Station Offset: the station's frequency minus the radio's center
    frequency, so a radio tuned off the station (away from its DC spike)
    still decodes it.

    Outputs: for each program in Programs, in order, a left and a right
    float stream at 44,100 S/s (one stream per program in Mono). Programs
    [] decodes metadata only. HD1 is program 0, HD2 is 1, and so on. An
    "id3" stream tag marks the first sample of each new song.

    Audio Timing: Paced gives exactly 44,100 samples per second of input,
    silent until Preroll seconds of audio are buffered and after a dropout;
    use it for an Audio Sink. Burst gives decoded audio only, as soon as it
    is decoded; use it for file sinks.

    Message ports: dicts whose "event" key names the event, or PDUs.
      status    sync, lost_sync, mer, ber, agc
      station   station name, slogan, message, location, ID, alerts, time
      services  the service list (SIG) and each audio service
      id3       title, artist, album, genre, per program
      files     PDUs: LOT files (album art, station logos), HERE images;
                connect HD File Sink to save them
      data      PDUs: packet and stream data services
      hdc       PDUs: raw HDC audio packets

    Built on nrsc5 (github.com/theori-io/nrsc5), which must be installed;
    see gr-hdradio's README.

file_format: 1
